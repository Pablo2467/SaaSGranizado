# SERVIDOR
server.port=${PORT:8080}
# BASE DE DATOS
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/granizado_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres123}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de conexiones
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# JPA / HIBERNATE

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# FLYWAY — MIGRACIONES
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT
jwt.secret=${JWT_SECRET:granizado-express-clave-secreta-desarrollo-local-2024-muy-larga-para-seguridad}
jwt.expiration.ms=86400000

# CORS (lo lee SecurityConfig.java; acepta varias URLs separadas por coma)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging.level.org.springframework.security=INFO